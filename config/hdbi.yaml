# kinetree settings for the HDBI LARRY data (FL / FBM / CB, D3 / D10 / D17)

run_name: hdbi_261121
runs_dir: runs

inputs:
  cells: inputs/obs_umap.parquet          # one row per cell
  labels: inputs/metaclone_labels.csv     # one row per clone: clone_id, meta_clone
  scaling: inputs/scaling_factors.pkl     # experiment x timepoint factor, raw -> absolute cell number

columns:
  clone: Clone_X
  celltype: def_lab2
  timepoint: Timepoint
  experiment: Donor_Tissue
  label_clone: clone_id
  label_group: meta_clone

cell_filter:                              # keep cells where column == value
  GlyA_Syb: GlyA-

timepoints:                               # name in the cell table: day
  D3: 3
  D10: 10
  D17: 17

group_prefix: MTC                         # row names MTC1..MTC19, then BG

# populations in model order; the first one is the root (all day-0 cells start there)
populations:
  HSC/MPP: [HSC1, HSC2, MPP]
  ELP: [ELP]
  My-Ly progenitor: [My-Ly progenitor]
  MEMP: [MEMP]
  GMP: [GMP]
  EoBasoMast Precursor: [EoBasoMast Precursor]
  Mast cell progenitor: [Mast cell progenitor]
  Monocyte progenitor: [Monocyte progenitor]
  Neutrophil progenitor: [neutrophil prognitor]
  Megakaryocyte: [Megakaryocyte]
  CFU-E: [CFU-E]
  Pro-Erythroblast: [Pro-Erythroblast]
  Basophilic Erythroblast: [Basophilic Erythroblast]
  Polychromatic Erythroblast: [Polychromatic Erythroblast]
  Orthochromatic Erythroblast: [Orthochromatic Erythroblast]
  Mast cell: [Mast cell]
  Basophil: [Basophil]
  Eosinophil: [Eosinophil]
  Monocyte: [Monocyte]
  Neutrophil: [neutrophil]
  DC: [Pre-cDC]

terminal: [Megakaryocyte, Orthochromatic Erythroblast, Mast cell, Basophil, Eosinophil, Monocyte, Neutrophil, DC]
# populations that may not divide in CLADES (soft penalty, alphas[1]); as in the CLADES examples, mature end populations
# only; DC (= Pre-cDC, a precursor) is free, like 'DC precursor' in the CLADES cord blood example
no_proliferation: [Megakaryocyte, Orthochromatic Erythroblast, Mast cell, Basophil, Eosinophil, Monocyte, Neutrophil]
early: [HSC/MPP, ELP, My-Ly progenitor, MEMP, GMP, EoBasoMast Precursor, Mast cell progenitor,
        Monocyte progenitor, Neutrophil progenitor]

# day 0: 'founders' = number of clones per group (CLADES authors, cord blood example);
#        'd3_total' = scaled D3 cell total per group (runs 260901 / 260903)
day0: founders

# background row: all filtered cells of the scaled experiments (barcoded or not);
# its day 0 is the number of clones with at least one filtered cell

# programs and environments
tools:
  python: /rds/project/rds-SDzz0CATGms/users/ql321/tools/micromamba_envs/envs/rpy2_env3/bin/python
  carta_python: /rds/project/rds-SDzz0CATGms/users/ql321/tools/micromamba_envs/envs/carta/bin/python3
  carta_dir: /rds/project/rds-SDzz0CATGms/users/ql321/work/larry_barcode/SLX26813_250925/landscape_251007/2_fig2_analysis_251203/meta_clones_prog_260111/carta_tree_process_260723/CARTA   # raphael-group/CARTA cd5733c9
  gurobi_license: /usr/local/Cluster-Apps/gurobi/12.0.3/linux64/licenses/gurobi.lic
  slurm_cpu_account: gottgens-sl2-cpu
  slurm_cpu_partition: icelake

# CARTA: clone x fate presence -> progenitor potencies -> tree
carta:
  fates:                                  # cell type -> fate; Undifferentiated = not a fate
    HSC1: Undifferentiated
    HSC2: Undifferentiated
    MPP: Undifferentiated
    MEMP: Undifferentiated
    GMP: Undifferentiated
    ELP: Undifferentiated
    My-Ly progenitor: Undifferentiated
    EoBasoMast Precursor: Undifferentiated
    CFU-E: Erythroid
    Pro-Erythroblast: Erythroid
    Basophilic Erythroblast: Erythroid
    Polychromatic Erythroblast: Erythroid
    Orthochromatic Erythroblast: Erythroid
    Mast cell progenitor: Mast
    Mast cell: Mast
    neutrophil prognitor: Neutrophil
    neutrophil: Neutrophil
    Monocyte progenitor: Monocyte
    Monocyte: Monocyte
    Pre-cDC: DC
    Megakaryocyte: Meg
    Basophil: Basophil
    Eosinophil: Eosinophil
  clones: all                             # 'all' barcoded clones, or 'labelled' (meta-clone clones only)
  min_cells_per_fate: 1                   # a clone has a fate if it has at least this many cells of it
  threshold: 5                            # larry.py -t: drop fate profiles seen in fewer clones
  kmax: 8                                 # sweep k = 1..kmax progenitors (tree mode, -r)
  k: 7                                    # k used for the tree; 'elbow' = kneedle choice
  short: {Erythroid: Ery, Mast: Ma, Monocyte: Mo, Neutrophil: Neu, Eosinophil: Eo, Basophil: Ba, DC: DC, Meg: Meg}

# support for the tree: PAGA (expression only) and CoSpar (clonal fate coupling)
support:
  pca: inputs/pca_harmony.parquet         # cells x components, same cells as inputs.cells
  paga_neighbors: 15
  paga_threshold: 0.1                     # edges drawn in the PAGA figure
  cospar_python: /rds/project/rds-SDzz0CATGms/users/ql321/tools/micromamba_envs/envs/cospar_env/bin/python
  cospar_times: [all, D10, D17]           # D3 has almost no mature cells

# candidate edges (step 5c): previous graph + PAGA links; evidence per edge
edges:
  previous_graph: ../2_fig2_analysis_251203/meta_clones_prog_260111/run_CLADES_260901/data/graph_table_260901.csv
  paga_candidate: 0.15                    # PAGA links at least this strong become candidates
  paga_support: 0.10                      # PAGA supports an edge at least this strong
  min_d3_clones: 20                       # source populations with fewer D3 clones have no clonal evidence
  clonal_support: 0.05                    # share of the source's D3 clones with cells in the target at later days

# population colours (d_cts_colors; HSC/MPP = MPP grey)
colors:
  HSC/MPP: '#aaaaaa'
  ELP: '#73ab35'
  My-Ly progenitor: '#459488'
  MEMP: '#ff815e'
  GMP: '#80cbc4'
  EoBasoMast Precursor: '#824a01'
  Mast cell progenitor: '#ebe199'
  Monocyte progenitor: '#7edef4'
  Neutrophil progenitor: '#7ab9e1'
  Megakaryocyte: '#844676'
  CFU-E: '#d9a3cd'
  Pro-Erythroblast: '#eeb2bf'
  Basophilic Erythroblast: '#f56d8a'
  Polychromatic Erythroblast: '#e1264d'
  Orthochromatic Erythroblast: '#961933'
  Mast cell: '#d3bb1a'
  Basophil: '#C45D2F'
  Eosinophil: '#f5a311'
  Monocyte: '#0ea3f0'
  Neutrophil: '#000080'
  DC: '#355314'

# transition graph used by CLADES (step 6): source -> targets; decided from support/edges.csv (2026-11-19)
#   = previous graph (run_CLADES_260901) - GMP->DC (0/284 GMP clones make DC) + ELP->DC (45 % of ELP clones, PAGA .61)
#     + EoBasoMast Precursor->Mast cell progenitor (21 % of EoBaMC clones, PAGA .38; MEMP->Mast prog also kept)
#   not added: MEMP->Pro-Erythroblast (MEMP->CFU-E PAGA .87 covers it), GMP->EoBaMC (2 % of GMP clones),
#   PAGA-only links between committed/mature types
graph:
  HSC/MPP: [ELP, My-Ly progenitor, MEMP, GMP]
  ELP: [My-Ly progenitor, DC]
  My-Ly progenitor: [GMP, DC]
  GMP: [Monocyte progenitor, Neutrophil progenitor]
  MEMP: [Megakaryocyte, CFU-E, Mast cell progenitor, EoBasoMast Precursor]
  EoBasoMast Precursor: [Mast cell progenitor, Basophil, Eosinophil]
  Mast cell progenitor: [Mast cell]
  Monocyte progenitor: [Monocyte]
  Neutrophil progenitor: [Neutrophil]
  CFU-E: [Pro-Erythroblast]
  Pro-Erythroblast: [Basophilic Erythroblast]
  Basophilic Erythroblast: [Polychromatic Erythroblast]
  Polychromatic Erythroblast: [Orthochromatic Erythroblast]

# CLADES (step 7): fit, then Gillespie; GPU jobs chained with SLURM
clades:
  code_dir: /rds/project/rds-SDzz0CATGms/users/ql321/work/larry_barcode/analysis_SLX24185_240304/big_datasets/run_CLADES_241026/clonaltrans/clonaltrans   # StatBiomed/clonaltrans a2d6013
  python: /rds/project/rds-SDzz0CATGms/users/ql321/tools/scVI_env3/bin/python3
  slurm_gpu_account: gottgens-sl2-gpu
  slurm_gpu_partition: ampere
  K_type: dynamic
  hidden_dim: 32
  activation: softplus
  epochs: 2500
  learning_rate: 1.0e-3
  lr_milestones: [400, 800, 1200, 1600, 2000]   # learning rate halves at each; run hdbi_261119 used [200, 400, 600, 800, 1000]
  alphas: [1.0, 0.5, 0.5, 0.25, 0.05, 0.5]
  ub_for_prol: 6
  ub_for_diff: 6
  seed: 42
  fit_hours: 16
  gillespie: {time_interval: 0.01, concurrent: 20, epoch: 50, t_cutoff: 1.0e-4, hours: 24}

# diagnostics (step 8): rows below either threshold are labelled 'do not quote'
diagnostics:
  min_cells_last: 40000                   # scaled cells at the last timepoint
  min_pops_last: 4                        # populations with cells at the last timepoint
