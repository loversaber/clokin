# Settings of the computer clokin runs on (environments, external code, SLURM). Copy to config/site.yaml (not in git),
# fill in, and start a dataset config with `base: <path to>/config/site.yaml`.
tools:
  python: /path/to/envs/clokin/bin/python            # pandas, numpy, scipy, matplotlib, scanpy, anndata, pyarrow, pyyaml
  carta_python: /path/to/envs/carta/bin/python       # CARTA + gurobipy
  carta_dir: /path/to/CARTA                          # github.com/raphael-group/CARTA (cd5733c9)
  gurobi_license: /path/to/gurobi.lic
  slurm_cpu_account: your-cpu-account
  slurm_cpu_partition: your-cpu-partition
support:
  cospar_python: /path/to/envs/cospar/bin/python     # cospar 0.5.0
clades:
  code_dir: /path/to/clonaltrans/clonaltrans         # github.com/StatBiomed/clonaltrans (a2d6013)
  python: /path/to/envs/clades/bin/python            # torch (CUDA), torchdiffeq, natsort, CLADES requirements
  slurm_gpu_account: your-gpu-account
  slurm_gpu_partition: your-gpu-partition
